# /.github/workflows/ci.yml

name: Validate policy automation

on:
  pull_request:
    paths:
      - .github/scripts/discover.py
      - .github/tests/**
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/discover.py
      - .github/tests/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test read-only discovery
        run: python3 -m unittest discover -s .github/tests -v
